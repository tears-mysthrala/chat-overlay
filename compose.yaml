services:
  overlay:
    build: .
    image: chat-overlay:local
    ports:
      - "127.0.0.1:4100:4100"
    environment:
      CHAT_CONFIG: /config/profiles.json
      ERL_FLAGS: "+S 2:2 +P 32768 +Q 8192"
      TWITCH_CLIENT_ID: "${TWITCH_CLIENT_ID:-}"
      TWITCH_CLIENT_SECRET: "${TWITCH_CLIENT_SECRET:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      CHAT_ENCRYPTION_KEY: "${CHAT_ENCRYPTION_KEY:-}"
    volumes:
      # Demo mode mounts demo.json read-only.
      # For persistent mode with OAuth account linking and dynamic profiles, mount a writable config file or volume:
      # - ./config/local-profiles.json:/config/profiles.json:rw
      - ./config/demo.json:/config/profiles.json:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    init: true
    restart: "no"
    stop_grace_period: 15s
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"
