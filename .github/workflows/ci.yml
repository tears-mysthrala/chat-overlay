name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Elixir and OTP
        uses: erlef/setup-beam@0f75c29430f34bb5af4cce5e3b7f6a8860fca236
        with:
          otp-version: "29.0.6"
          elixir-version: "1.20.4"
          install-hex: true
          install-rebar: false
      - name: Check toolchain availability
        run: |
          elixir --version
          mix --version
      - name: Check format and tests
        run: mix check
      - name: Check issue traceability
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BRANCH_ISSUE="$(printf '%s' "$HEAD_REF" | sed -nE 's#^(feat|fix|test|docs|chore|security)/([1-9][0-9]*)-.*#\2#p')"
            if [ -z "$BRANCH_ISSUE" ]; then
              echo 'PR branch must start with an issue number'; exit 1;
            fi

            ISSUE_REFERENCES="$(printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | grep -Eo '#[1-9][0-9]*' | sort -u || true)"
            printf '%s\n' "$ISSUE_REFERENCES" | grep -Fxq "#$BRANCH_ISSUE" || {
              echo 'PR branch issue number must match a PR title or body reference'; exit 1;
            }
          fi
