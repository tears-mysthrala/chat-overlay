name: CI
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  issues: read
jobs:
  source-and-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify issue traceability
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_traceability.py
      - name: Verify CI evidence validator
        run: python3 -m unittest discover -s scripts/tests
      - name: Project static checks
        run: |
          python3 scripts/security_static.py
          node --check priv/static/app.js
          node --check scripts/browser_checks.js
          node --check scripts/browser_ci.js
          node --check scripts/browser_fixture_proxy.js
          bash -n scripts/ci_browser.sh
      - name: Scan repository source for secrets
        run: python3 scripts/scan_secrets.py
      - name: Build validation image, audit Hex and check licenses
        run: docker build --target validation -t chat-overlay:validation .
      - name: ExUnit serial and concurrent, no network
        id: exunit
        run: |
          mkdir -p output/tests
          docker run --rm --network none --cpus 2 --memory 1g --pids-limit 128 -e ERL_FLAGS='+S 2:2' -e CI_TEST_REPORT_DIR=/evidence -v "$PWD/output/tests:/evidence" chat-overlay:validation sh scripts/ci_tests.sh
      - name: Reject skipped, excluded, empty or incomplete test results
        if: ${{ always() && steps.exunit.outcome != 'skipped' }}
        run: python3 scripts/check_test_report.py output/tests/exunit-0.json output/tests/exunit-424242.json
      - name: Install pinned browser test tooling (development only)
        timeout-minutes: 5
        run: |
          node -e 'if (Number(process.versions.node.split(".")[0]) < 20) process.exit(1)'
          npm ci --ignore-scripts --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Browser desktop and mobile, isolated synthetic fixture
        timeout-minutes: 5
        run: bash scripts/ci_browser.sh
      - name: Synthetic load (no platform access)
        run: |
          set -o pipefail
          docker run --rm --network none --cpus 2 --memory 1g -e ERL_FLAGS='+S 2:2' chat-overlay:validation mix run --no-start scripts/load.exs 30 | tee output/load.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-evidence
          path: |
            output/tests/*.json
            output/load.json
            output/browser/result.json
            output/secrets/gitleaks.json
          retention-days: 14
  image-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build release image
        run: docker build -t chat-overlay:review .
      - name: Verify hardened runtime
        run: python3 scripts/smoke_image.py chat-overlay:review
      - name: Install SBOM schema validator (development only)
        run: |
          python3 -m venv "$RUNNER_TEMP/overlay-audit"
          "$RUNNER_TEMP/overlay-audit/bin/python" -m pip install jsonschema==4.26.0 referencing==0.37.0
      - name: SBOM schema and all-severity vulnerability gate
        run: '"$RUNNER_TEMP/overlay-audit/bin/python" scripts/audit_image.py chat-overlay:review'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: image-evidence
          path: |
            output/audit/*.json
          retention-days: 14

  quality-gate:
    if: ${{ always() }}
    needs: [source-and-tests, image-security]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all validation jobs to succeed
        env:
          SOURCE_RESULT: ${{ needs.source-and-tests.result }}
          IMAGE_RESULT: ${{ needs.image-security.result }}
        run: |
          test "$SOURCE_RESULT" = success
          test "$IMAGE_RESULT" = success
