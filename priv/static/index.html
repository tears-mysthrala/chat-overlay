<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat Overlay</title><link rel="stylesheet" href="/assets/app.css"><script src="/assets/app.js" defer></script></head>
<body class="home"><main class="welcome"><div class="wordmark"><span class="mark" aria-hidden="true">≋</span> Chat Overlay</div><h1>La conversación,<br>en un solo lugar.</h1><p class="intro">Twitch, YouTube y Kick. Un chat para leer en directo y una vista limpia para tu escena de OBS.</p><form id="open-profile"><label for="handle">Tu perfil</label><div class="input-row"><input id="handle" name="handle" required pattern="[a-z0-9][a-z0-9_\-]{0,39}" maxlength="40" autocomplete="off" placeholder="nombre-del-perfil"><button type="submit">Abrir chat</button></div><p class="hint">Usa el perfil habilitado por quien administra este servicio.</p></form><div class="platform-key"><span>Twitch</span><span>YouTube</span><span>Kick</span></div><p class="privacy-note">Solo lectura. Sin cuentas de usuario ni historial en disco.</p></main></body></html>
